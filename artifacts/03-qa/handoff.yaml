key_decisions:
  - Testes de service (simulate-service.ts) foram escritos como testes de logica pura (sem mock do Prisma) pois o servico e simples o suficiente para testar os calculos isoladamente
  - Testes de schema usam safeParse() diretamente — nenhuma chamada HTTP envolvida
  - localStorage mockado via vi.stubGlobal para isolar os testes de historico do browser real

